# Build des binaires de l'agent à chaque tag v* (voir .github/workflows/release.yml).
version: 2
project_name: agent

builds:
  - id: agent
    main: ./cmd/agent
    binary: agent
    env: [CGO_ENABLED=0]
    goos: [windows, linux, darwin]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    ldflags: ["-s -w -X main.version={{ .Version }}"]
  - id: agent-tray                          # icône de la barre des tâches, Windows seulement, sans console
    main: ./cmd/agent-tray
    binary: agent-tray
    env: [CGO_ENABLED=0]
    goos: [windows]
    goarch: [amd64]
    ldflags: ["-s -w -H=windowsgui -X main.version={{ .Version }}"]

archives:
  - formats: [binary]                       # un binaire nu par plateforme, téléchargeable directement
    name_template: "{{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

signs:
  - id: checksums
    artifacts: checksum
    cmd: go
    args: ["run", "./cmd/relsign", "sign", "-key-env", "RELEASE_SIGNING_KEY", "-o", "${signature}", "${artifact}"]
    signature: "${artifact}.sig"

release:
  github:
    owner: jeromerobitaille
    name: festival-command-center
  name_template: "agent {{ .Version }}"
  header: |
    Binaires de l'agent. Les laptops se mettent à jour seuls (vérification signature + SHA-256).
    Installation Windows : télécharger `agent_{{ .Version }}_windows_amd64.exe` → `agent.exe` et
    `agent-tray_{{ .Version }}_windows_amd64.exe` → `agent-tray.exe` dans le même dossier, double-cliquer `agent-tray.exe`,
    puis dans le menu de l'icône : « Installer le service » et « Entrer la clé de projet ».

changelog:
  use: git
  filters:
    exclude: ["^docs", "^chore", "^ci"]

# Build des binaires de l'agent à chaque tag v* (voir .github/workflows/release.yml).
version: 2
project_name: agent

builds:
  - id: agent
    main: ./cmd/agent
    binary: agent
    env: [CGO_ENABLED=0]
    goos: [windows, linux, darwin]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    ldflags: ["-s -w -X main.version={{ .Version }}"]
  - id: agent-tray                          # icône de la barre des tâches, Windows seulement, sans console
    main: ./cmd/agent-tray
    binary: agent-tray
    env: [CGO_ENABLED=0]
    goos: [windows]
    goarch: [amd64]
    ldflags: ["-s -w -H=windowsgui -X main.version={{ .Version }}"]

archives:
  - id: binaries
    formats: [binary]                       # un binaire nu par plateforme (mise à jour automatique)
    name_template: "{{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
  - id: bundle                              # zip prêt à l'emploi ; sous Windows : agent.exe + agent-tray.exe
    ids: [agent, agent-tray]
    formats: [zip]
    allow_different_binary_count: true      # agent-tray n'existe que pour Windows
    name_template: "festival-agent_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [agent.example.toml]

checksum:
  name_template: checksums.txt

signs:
  - id: checksums
    artifacts: checksum
    cmd: go
    args: ["run", "./cmd/relsign", "sign", "-key-env", "RELEASE_SIGNING_KEY", "-o", "${signature}", "${artifact}"]
    signature: "${artifact}.sig"

release:
  github:
    owner: jeromerobitaille
    name: festival-command-center
  name_template: "agent {{ .Version }}"
  header: |
    Binaires de l'agent. Les laptops se mettent à jour seuls (vérification signature + SHA-256).
    **Installation Windows** : lancer `FestivalCommandCenter-Agent-Setup-{{ .Version }}.exe`. Il installe le service,
    place l'icône dans la barre des tâches et ouvre la fenêtre de configuration où l'on colle la clé du projet.
    (Le zip `festival-agent_{{ .Version }}_windows_amd64.zip` reste disponible pour une installation manuelle.)

changelog:
  use: git
  filters:
    exclude: ["^docs", "^chore", "^ci"]

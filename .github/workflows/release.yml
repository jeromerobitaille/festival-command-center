name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: Installer NSIS (installateur Windows)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nsis
      - name: Vérifier que la clé de signature est configurée
        run: test -n "$RELEASE_SIGNING_KEY" || { echo "secret RELEASE_SIGNING_KEY manquant"; exit 1; }
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          workdir: agent
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
      - name: Installateur Windows (NSIS) joint à la release
        working-directory: agent
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          installer/build.sh "$VERSION"
          gh release upload "$GITHUB_REF_NAME" dist/installer/*.exe --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

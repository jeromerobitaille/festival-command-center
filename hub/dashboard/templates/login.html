<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connexion · Festival Command Center</title><link rel="stylesheet" href="/static/app.css"></head>
<body class="login-page">
<form method="post" action="/login" class="login card">
  <h1>Festival Command Center</h1>
  <p class="muted">Connectez-vous pour accéder aux projets.</p>
  {{if .Error}}<p class="err">{{.Error}}</p>{{end}}
  <input type="hidden" name="next" value="{{.Next}}">
  <label>Utilisateur <input name="username" autocomplete="username" required autofocus></label>
  <label>Mot de passe <input name="password" type="password" autocomplete="current-password" required></label>
  <button class="btn primary">Se connecter</button>
</form>
</body></html>
